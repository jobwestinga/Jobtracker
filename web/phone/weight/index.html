<!DOCTYPE html>
<html lang="en" data-profile="weight">
<head>
<!-- Generated by scripts/generate_phone_apps.py; edit web/index.html. -->
<meta charset="utf-8">
<!-- viewport-fit=cover + the safe-area padding in the CSS keeps the bottom bar
     clear of the iPhone home indicator once this is on the home screen.
     An opaque status bar: iOS 26+ standalone apps with black-translucent paint
     the page one status-bar height short of the bottom and blur the header. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Weight">
<meta name="theme-color" content="#0B1220">
<link rel="manifest" href="/phone/weight/manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/weight-touch.png">
<link rel="stylesheet" href="/styles/tokens.css">
<link rel="stylesheet" href="/styles/shell.css">
<link rel="stylesheet" href="/styles/controls.css">
<link rel="stylesheet" href="/features/subjects/styles.css">
<link rel="stylesheet" href="/features/goals/styles.css">
<link rel="stylesheet" href="/features/sessions/styles.css">
<link rel="stylesheet" href="/features/graphs/styles.css">
<link rel="stylesheet" href="/features/settings/styles.css">
<link rel="stylesheet" href="/features/weight/styles.css">
<link rel="stylesheet" href="/shared/fullscreen.css">
<title>Weight</title>
</head>
<body>

<!-- One-time setup: the token is entered here and kept in localStorage. -->
<section id="setup" class="screen setup hidden">
  <h1>Weight</h1>
  <p class="muted">Connect this phone to your server.</p>
  <label for="setup-token">Access token</label>
  <input id="setup-token" type="password" autocomplete="off" autocapitalize="off"
         autocorrect="off" spellcheck="false" placeholder="paste this installation's token">
  <button id="setup-save" class="primary">Connect</button>
  <p id="setup-error" class="error" role="status" aria-live="polite"></p>
  <a href="/phone/" target="_blank" rel="noopener">Install Weight and JobTracker on your iPhone</a>
</section>

<main id="app" class="hidden">
  <header class="topbar">
    <div class="topbar-heading">
      <h1 id="view-title">Weight</h1>
      <button id="sync-status" class="sync-status" type="button" aria-describedby="sync-status-hint">Checking sync</button>
      <span id="sync-status-hint" class="sr-only">Opens sync details and waiting changes.</span>
    </div>
    <div class="topbar-actions">
      <button id="refresh" class="icon-btn" aria-label="Refresh"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20 12a8 8 0 1 1-2.34-5.66L19.4 8.1M14.9 8.1h4.5V3.6"/></svg></button>
      <button id="open-settings" class="icon-btn" aria-label="Settings"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg></button>
    </div>
  </header>

  <div id="banner" class="banner hidden" aria-live="off"></div>

  <!-- Today: the running timer and one-tap start. -->
  <div id="views">
  <section id="view-today" class="view hidden">
    <div class="seg">
      <button id="subjects-active" class="seg-btn on">Active</button>
      <button id="subjects-archived" class="seg-btn">Archived</button>
    </div>
    <div id="active-card" class="card active-card hidden">
      <div class="active-dot" id="active-dot"></div>
      <div class="active-body">
        <div class="active-name" id="active-name">—</div>
        <div class="active-elapsed" id="active-elapsed">0:00:00</div>
      </div>
      <button id="stop-btn" class="danger">Stop</button>
    </div>
    <p id="idle-note" class="muted">Nothing is running. Tap a subject to start.</p>
    <div id="subject-list" class="list"></div>
    <button id="add-subject" class="primary wide">+ Add subject</button>
  </section>

  <!-- Sessions for one logical day. -->
  <section id="view-sessions" class="view hidden">
    <div class="day-nav">
      <button id="day-prev" class="ghost" aria-label="Previous tracking day">&#8592;</button>
      <div id="day-label" class="day-label">—</div>
      <button id="day-next" class="ghost" aria-label="Next tracking day">&#8594;</button>
    </div>
    <div class="day-tools row">
      <input id="day-date" type="date" aria-label="Tracking day">
      <button id="day-today" class="secondary">Today</button>
    </div>
    <div id="day-total" class="muted day-total"></div>
    <div id="session-list" class="list"></div>
    <button id="add-session" class="primary wide">+ Add session</button>
  </section>

  <!-- Goals and their milestones. -->
  <section id="view-goals" class="view hidden">
    <div class="seg">
      <button id="goals-active" class="seg-btn on">Active</button>
      <button id="goals-done" class="seg-btn">Completed</button>
    </div>
    <div id="goal-list" class="list"></div>
    <button id="add-goal" class="primary wide">+ Add goal</button>
    <button id="goal-templates" class="ghost wide">Recurring goals</button>
  </section>

  <section id="view-graphs" class="view hidden">
    <div class="graph-toolbar">
      <span class="muted">Tracked time</span>
      <button id="graph-fullscreen" class="secondary" aria-expanded="false">Fullscreen</button>
    </div>
    <!-- Two choices, like the desktop: which view, and over what range. -->
    <div class="seg">
      <button class="seg-btn on" data-mode="bars">Bars</button>
      <button class="seg-btn" data-mode="agenda">Agenda</button>
    </div>
    <div class="seg seg-range">
      <button class="seg-btn on" data-range="7">Week</button>
      <button class="seg-btn" data-range="30">Month</button>
      <button class="seg-btn" data-range="365">Year</button>
      <button class="seg-btn" data-range="all">All</button>
      <button class="seg-btn" data-range="custom">Custom</button>
    </div>
    <div id="graph-custom" class="row hidden">
      <div class="field"><label for="graph-start">From</label><input id="graph-start" type="date"></div>
      <div class="field"><label for="graph-end">Through</label><input id="graph-end" type="date"></div>
    </div>
    <!-- Bucket size, same choice the desktop offers. "Auto" follows the range. -->
    <div class="seg seg-group">
      <button class="seg-btn on" data-group="auto">Auto</button>
      <button class="seg-btn" data-group="daily">Days</button>
      <button class="seg-btn" data-group="weekly">Weeks</button>
      <button class="seg-btn" data-group="monthly">Months</button>
    </div>
    <div id="graph-total" class="muted day-total"></div>
    <button id="graph-options" class="ghost wide hidden">Agenda hours</button>
    <div id="graph-body" aria-label="Tracking graphs"></div>
    <div id="graph-legend" class="legend"></div>
  </section>

  <section id="view-weight" class="view">
    <div id="weight-body"></div>
  </section>

  </div>

  <nav class="tabbar hidden" aria-label="App sections">
    <button class="tab on" data-view="weight"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3.5" y="3.5" width="17" height="17" rx="4.5"/><path d="M8 11a5.5 5.5 0 0 1 8 0M12 12.5l1.6-2.4"/></svg>Weight</button>
  </nav>
</main>

<!-- A single reusable sheet, filled in by whichever action opened it. -->
<div id="sheet" class="sheet-wrap hidden">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1">
    <div class="sheet-head">
      <h2 id="sheet-title" tabindex="-1">—</h2>
      <button id="sheet-close" class="icon-btn" aria-label="Close">&#10005;</button>
    </div>
    <div id="sheet-body"></div>
  </div>
</div>

<div id="announcements" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

<script type="module" src="/app.js"></script>
</body>
</html>
