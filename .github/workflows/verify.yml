name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: References, boundaries and offline assets
        run: python scripts/dev.py check
      - name: Python and native regressions
        run: python scripts/dev.py test
      - name: Shared phone contracts
        run: python scripts/dev.py mobile
      - name: Install isolated browser test tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/jobtracker-browser" playwright
          "$RUNNER_TEMP/jobtracker-browser/node_modules/.bin/playwright" install chromium
      - name: Browser regressions and synthetic performance
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/jobtracker-browser/node_modules/playwright"
          export JOBTRACKER_BROWSER_ARTIFACTS="$RUNNER_TEMP/jobtracker-browser-artifacts"
          python scripts/dev.py browser
      - name: Preserve browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-checks
          path: ${{ runner.temp }}/jobtracker-browser-artifacts
          if-no-files-found: ignore
